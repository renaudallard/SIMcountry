[package]
name = "simcountryd"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "simcountryd"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
